<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cocktail AI - Made by Sheheryar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .animated-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.12;
    animation: float 10s ease-in-out infinite;
  }
  .orb1 { width: 500px; height: 500px; background: #7c3aed; top: -200px; left: -100px; animation-delay: 0s; }
  .orb2 { width: 350px; height: 350px; background: #2563eb; top: 40%; right: -100px; animation-delay: 3s; }
  .orb3 { width: 400px; height: 400px; background: #7c3aed; bottom: -150px; left: 35%; animation-delay: 6s; }

  @keyframes float {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-40px) scale(1.05); }
  }

  .header {
    position: relative;
    z-index: 10;
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(13,13,15,0.8);
    backdrop-filter: blur(20px);
  }

  .logo {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 18px;
  }

  .header-info h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .header-info p { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 1px; }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    z-index: 1;
    scroll-behavior: smooth;
  }

  .chat-container::-webkit-scrollbar { width: 4px; }
  .chat-container::-webkit-scrollbar-track { background: transparent; }
  .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .welcome {
    text-align: center;
    padding: 60px 20px 40px;
    max-width: 500px;
    margin: 0 auto;
  }

  .welcome-logo {
    width: 70px; height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 30px; color: white;
    animation: glow 3s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 0 20px rgba(124,58,237,0.3); }
    50% { box-shadow: 0 0 40px rgba(124,58,237,0.6); }
  }

  .welcome h2 {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #fff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .welcome p {
    font-size: 15px;
    color: rgba(255,255,255,0.4);
    line-height: 1.7;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 28px;
  }

  .suggestion-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 10px 18px;
    font-size: 13px;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
  }
  .suggestion-btn:hover {
    background: rgba(124,58,237,0.2);
    border-color: rgba(124,58,237,0.5);
    color: #fff;
    transform: translateY(-1px);
  }

  .messages { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .msg { display: flex; gap: 12px; align-items: flex-start; animation: fadeUp 0.3s ease; }
  .msg.user { flex-direction: row-reverse; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600;
    flex-shrink: 0;
  }
  .bot-av { background: linear-gradient(135deg, #7c3aed, #2563eb); color: white; }
  .user-av { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font-size: 13px; }

  .bubble {
    max-width: 72%;
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.7;
  }
  .bot-bubble {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.88);
    border-top-left-radius: 4px;
  }
  .user-bubble {
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    color: white;
    border-top-right-radius: 4px;
  }

  .typing-dots { display: flex; gap: 5px; align-items: center; padding: 2px 0; }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    animation: bounce 1.3s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.18s; }
  .dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-8px); }
  }

  .input-area {
    position: relative;
    z-index: 10;
    padding: 16px 24px 24px;
    background: rgba(13,13,15,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .input-wrap {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 32px;
    padding: 10px 14px 10px 20px;
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within {
    border-color: rgba(124,58,237,0.6);
    box-shadow: 0 0 0 3px rgba(124,58,237,0.08);
  }

  .chat-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-size: 15px;
    color: rgba(255,255,255,0.9);
    font-family: inherit;
  }
  .chat-input::placeholder { color: rgba(255,255,255,0.25); }

  .send-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #2563eb);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 17px;
    transition: transform 0.15s, opacity 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { transform: scale(1.08); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.18);
    margin-top: 10px;
  }

  @media (max-width: 600px) {
    .bubble { max-width: 85%; }
    .header { padding: 12px 16px; }
    .chat-container { padding: 16px; }
    .input-area { padding: 12px 16px 20px; }
    .welcome h2 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="animated-bg">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="header">
  <div class="logo"><i class="ti ti-sparkles"></i></div>
  <div class="header-info">
    <h1>Cocktail AI</h1>
    <p>Made by Sheheryar</p>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    Online
  </div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="welcome" id="welcome">
    <div class="welcome-logo"><i class="ti ti-robot"></i></div>
    <h2>Hello, I'm Cocktail AI</h2>
    <p>Your intelligent book inventory assistant.<br>Ask me anything about your books or anything else!</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion('Show all books')"><i class="ti ti-books"></i> Show all books</button>
      <button class="suggestion-btn" onclick="sendSuggestion('Who made you?')"><i class="ti ti-user"></i> Who made you?</button>
      <button class="suggestion-btn" onclick="sendSuggestion('Check Silent Patient quantity')"><i class="ti ti-search"></i> Check Silent Patient</button>
      <button class="suggestion-btn" onclick="sendSuggestion('Update book quantity')"><i class="ti ti-edit"></i> Update quantity</button>
    </div>
  </div>
  <div class="messages" id="messages"></div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <input class="chat-input" id="chatInput" placeholder="Ask Cocktail AI anything..." onkeydown="handleKey(event)" autocomplete="off"/>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">
      <i class="ti ti-send"></i>
    </button>
  </div>
  <p class="footer-note">Powered by n8n + Groq AI &nbsp;·&nbsp; Made by Sheheryar</p>
</div>

<script>
  const N8N_URL = "https://sheheryar620052312.app.n8n.cloud/webhook/2825d40a-fa5b-4650-a7c3-da7bdcb9db3f/chat";
  const sessionId = "session_" + Math.random().toString(36).slice(2, 10);
  let isLoading = false;

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) sendMessage();
  }

  function sendSuggestion(text) {
    document.getElementById("chatInput").value = text;
    sendMessage();
  }

  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById("chatInput");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    isLoading = true;
    document.getElementById("sendBtn").disabled = true;

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.style.display = "none";

    addMessage(text, "user");
    const typingEl = addTyping();

    try {
      const res = await fetch(N8N_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "sendMessage", sessionId, chatInput: text })
      });
      const data = await res.json();
      typingEl.remove();
      const reply = data.output || data.text || data.message || "I received your message!";
      addMessage(reply, "bot");
    } catch (err) {
      typingEl.remove();
      addMessage("Connection error. Please make sure the n8n workflow is published and active!", "bot");
    }

    isLoading = false;
    document.getElementById("sendBtn").disabled = false;
    input.focus();
  }

  function addMessage(text, type) {
    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg " + type;
    const avatarContent = type === "bot" ? '<i class="ti ti-sparkles"></i>' : "S";
    div.innerHTML = `
      <div class="avatar ${type === "bot" ? "bot-av" : "user-av"}">${avatarContent}</div>
      <div class="bubble ${type === "bot" ? "bot-bubble" : "user-bubble"}">${text}</div>
    `;
    msgs.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function addTyping() {
    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg bot";
    div.innerHTML = `
      <div class="avatar bot-av"><i class="ti ti-sparkles"></i></div>
      <div class="bubble bot-bubble">
        <div class="typing-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    `;
    msgs.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }
</script>
</body>
</html>
